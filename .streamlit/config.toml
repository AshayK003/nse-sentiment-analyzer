[theme]
primaryColor = "#22b573"
backgroundColor = "#0a0b0f"
secondaryBackgroundColor = "#15181f"
textColor = "#f0f2f5"
font = "sans serif"

[server]
maxUploadSize = 200
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = true
runOnSave = false

[browser]
gatherUsageStats = false

[runner]
# One-time cache invalidation per session — avoids unbounded memory growth
# when many tickers are scanned in a single session
magicEnabled = false
